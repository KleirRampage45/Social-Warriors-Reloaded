<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Warriors Reloaded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #resources-bar {
            height: 48px;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 24px;
            border-bottom: 2px solid #e94560;
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        .resource-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        .resource-icon.cash { background: #85bb65; }
        .resource-icon.gold { background: #ffd700; }
        .resource-icon.wood { background: #8b4513; }
        .resource-icon.oil { background: #2f2f2f; }
        .resource-icon.steel { background: #708090; }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #0f3460;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
        }
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #game-ui > * {
            pointer-events: auto;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #loading-screen.hidden {
            display: none;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #menu-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(0deg, #16213e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            border-top: 2px solid #e94560;
        }
        .menu-btn {
            padding: 8px 16px;
            background: #e94560;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .menu-btn:hover {
            background: #ff6b8a;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="resources-bar">
            <div class="resource">
                <div class="resource-icon cash"></div>
                <span id="res-cash">0</span>
            </div>
            <div class="resource">
                <div class="resource-icon gold"></div>
                <span id="res-gold">0</span>
            </div>
            <div class="resource">
                <div class="resource-icon wood"></div>
                <span id="res-wood">0</span>
            </div>
            <div class="resource">
                <div class="resource-icon oil"></div>
                <span id="res-oil">0</span>
            </div>
            <div class="resource">
                <div class="resource-icon steel"></div>
                <span id="res-steel">0</span>
            </div>
        </div>
        <div id="canvas-container">
            <canvas id="game-canvas"></canvas>
            <div id="game-ui"></div>
        </div>
        <div id="menu-bar">
            <button class="menu-btn" id="btn-buildings">Buildings</button>
            <button class="menu-btn" id="btn-units">Units</button>
            <button class="menu-btn" id="btn-quests">Quests</button>
            <button class="menu-btn" id="btn-storage">Storage</button>
            <button class="menu-btn" id="btn-save">Save</button>
        </div>
    </div>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p style="margin-top: 16px;">Loading Social Warriors...</p>
    </div>
    <script src="game/index.js" type="module"></script>
</body>
</html>
