<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Warriors Reloaded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-title {
            font-size: 48px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            transition: width 0.3s ease;
        }
        .loading-text {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        #resources-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 24px;
            border-bottom: 2px solid #e94560;
            z-index: 100;
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .resource-value {
            min-width: 60px;
        }
        #menu-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(0deg, #16213e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            border-top: 2px solid #e94560;
            z-index: 100;
        }
        .menu-btn {
            padding: 8px 16px;
            background: #e94560;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .menu-btn:hover {
            background: #ff6b8a;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        #building-shop,
        #unit-shop {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            bottom: 56px;
            width: 320px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-left: 2px solid #e94560;
            overflow-y: auto;
            padding: 16px;
            z-index: 200;
        }
        #building-shop.open,
        #unit-shop.open {
            display: block;
        }
        .shop-title {
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }
        .shop-category {
            margin-bottom: 16px;
        }
        .category-name {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 8px;
        }
        .shop-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .shop-item:hover {
            background: rgba(233, 69, 96, 0.2);
        }
        .shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .shop-item-icon {
            width: 48px;
            height: 48px;
            background: #333;
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            word-break: break-word;
        }
        .shop-item-info {
            flex: 1;
        }
        .shop-item-name {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .shop-item-cost {
            font-size: 10px;
            color: #aaa;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: #e94560;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="resources-bar">
            <div class="resource">
                <span>Gold:</span>
                <span class="resource-value" id="res-gold">0</span>
            </div>
            <div class="resource">
                <span>Wood:</span>
                <span class="resource-value" id="res-wood">0</span>
            </div>
            <div class="resource">
                <span>Oil:</span>
                <span class="resource-value" id="res-oil">0</span>
            </div>
            <div class="resource">
                <span>Steel:</span>
                <span class="resource-value" id="res-steel">0</span>
            </div>
        </div>
        <div id="menu-bar">
            <button class="menu-btn" id="btn-buildings">Buildings</button>
            <button class="menu-btn" id="btn-units">Units</button>
            <button class="menu-btn" id="btn-quests">Quests</button>
            <button class="menu-btn" id="btn-storage">Storage</button>
            <button class="menu-btn" id="btn-save">Save</button>
        </div>
        <div id="building-shop">
            <button class="close-btn" id="close-buildings">&times;</button>
            <div class="shop-title">Buildings</div>
            <div id="building-list"></div>
        </div>
        <div id="unit-shop">
            <button class="close-btn" id="close-units">&times;</button>
            <div class="shop-title">Units</div>
            <div id="unit-list"></div>
        </div>
        <div id="loading-screen">
            <div class="loading-title">Social Warriors</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <div class="loading-text" id="loading-text">Initializing...</div>
        </div>
    </div>

    <script src="game/index.js" type="module"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</body>
</html>
